spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: project-A

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  servlet:
    session:
      timeout: 1h

app:
  async:
    analytics:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 500
      await-termination-seconds: 30

  analytics:
    retention:
      enabled: true
      months: 12
      batch-size: 1000
      cron: "0 0 3 * * *"
      zone: UTC

  mail:
    from: no-reply@voidcube.tech
    verification-subject: "Confirme seu e-mail - Project A"
    
  storage:
    images:
      max-size-bytes: 5242880
  
  messages:
    basename: messages
    enconding: UTF-8
    fallback-to-system-locale: false

