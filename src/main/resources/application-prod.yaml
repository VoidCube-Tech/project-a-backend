spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  frontend:
    url: ${APP_FRONTEND_URL}

  storage:
    images:
      directory: ${IMAGE_STORAGE_DIRECTORY}
server:
  servlet:
    cookie:
      secure: true
      http-only: true
      same-site: ${SESSION_COOKIE_SAME_SITE;lax}